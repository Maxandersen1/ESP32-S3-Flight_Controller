<!DOCTYPE html>
<html>
<head>
    <title>Max Flight Controller 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 100; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #e94560; color: white; border: none; border-radius: 8px; transition: background 0.3s; width: 100%; margin-bottom: 15px; }
        button:hover { background: #d03a55; }
        #status { font-size: 16px; margin-bottom: 10px; }
        #data { font-size: 18px; font-family: monospace; color: #0f3460; background: #fff; padding: 10px; border-radius: 5px; text-align: left; line-height: 1.5; }
        .setting { margin-top: 10px; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <button id="connectBtn">🔌 Anslut till Drönaren</button>
        <div id="status">Status: Frånkopplad</div>
        <div id="data">Roll: 0.0&deg;<br>Pitch: 0.0&deg;<br>Höjd: 0.0 m</div>
        
        <div class="setting">
            <label><input type="checkbox" id="invPitch"> Invertera Pitch (Upp/Ner)</label>
        </div>
        <div class="setting">
            <label><input type="checkbox" id="invRoll"> Invertera Roll (Höger/Vänster)</label>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const drone = new THREE.Group();
        scene.add(drone);

        const pcbGeo = new THREE.BoxGeometry(3, 0.15, 3);
        const pcbMat = new THREE.MeshPhongMaterial({ color: 0x112211, shininess: 50 });
        const pcb = new THREE.Mesh(pcbGeo, pcbMat);
        drone.add(pcb);

        const espGeo = new THREE.BoxGeometry(1.2, 0.2, 1.8);
        const espMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
        const esp = new THREE.Mesh(espGeo, espMat);
        esp.position.set(0, 0.15, -0.4); 
        drone.add(esp);

        const dir = new THREE.Vector3(0, 0, -1); 
        const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0.3, 0), 3, 0xff0000, 0.8, 0.5);
        drone.add(arrow);

        const armGeo = new THREE.BoxGeometry(0.2, 0.05, 5.5);
        const armMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        
        const arm1 = new THREE.Mesh(armGeo, armMat);
        arm1.rotation.y = Math.PI / 4;
        arm1.position.y = -0.1;
        drone.add(arm1);

        const arm2 = new THREE.Mesh(armGeo, armMat);
        arm2.rotation.y = -Math.PI / 4;
        arm2.position.y = -0.1;
        drone.add(arm2);

        const motorPositions = [
            {x: -1.9, z: -1.9, color: 0xffaaaa},
            {x: 1.9, z: -1.9, color: 0xffaaaa}, 
            {x: -1.9, z: 1.9, color: 0xaaaaaa}, 
            {x: 1.9, z: 1.9, color: 0xaaaaaa}   
        ];

        const motorGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.4, 16);
        const motorMat = new THREE.MeshPhongMaterial({ color: 0x222222, shininess: 100 });
        const propGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.02, 32);

        const propellers = [];

        for(let pos of motorPositions) {
            const motor = new THREE.Mesh(motorGeo, motorMat);
            motor.position.set(pos.x, 0.1, pos.z);
            drone.add(motor);
            
            const propMat = new THREE.MeshPhongMaterial({ color: pos.color, transparent: true, opacity: 0.6 });
            const prop = new THREE.Mesh(propGeo, propMat);
            prop.position.set(pos.x, 0.35, pos.z);
            drone.add(prop);
            propellers.push(prop);
        }

        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(5, 10, 5);
        scene.add(light1);
        
        const light2 = new THREE.DirectionalLight(0xaaccff, 0.5);
        light2.position.set(-5, 5, -5);
        scene.add(light2);
        
        scene.add(new THREE.AmbientLight(0x404040, 1.5));

        camera.position.set(4, 5, 6);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            for(let prop of propellers) {
                prop.rotation.y += 0.5;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- SERIELL KOMMUNIKATION ---
        let port;
        let reader;
        let keepReading = true;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                document.getElementById('status').innerText = "Status: Ansluten!";
                document.getElementById('status').style.color = "#00ff00";
                
                keepReading = true;
                readLoop();
            } catch (err) {
                console.error('Anslutningsfel:', err);
                document.getElementById('status').innerText = "Status: Fel (Är Serial Monitor öppen?)";
                document.getElementById('status').style.color = "#ff0000";
            }
        });

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let buffer = "";

            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (let line of lines) {
                        line = line.trim();
                        if (line.length > 0) {
                            let parts = line.split(',');
                            
                            // Nu förväntar vi oss: Pitch, Roll, Höjd
                            if (parts.length >= 2) {
                                let pitch = parseFloat(parts[0]);
                                let roll = parseFloat(parts[1]);
                                let alt = parts.length === 3 ? parseFloat(parts[2]).toFixed(2) : "0.00";

                                document.getElementById('data').innerHTML = `Pitch: ${pitch.toFixed(1)}&deg;<br>Roll: ${roll.toFixed(1)}&deg;<br>Höjd: ${alt} m`;

                                let invPitch = document.getElementById('invPitch').checked ? -1 : 1;
                                let invRoll = document.getElementById('invRoll').checked ? -1 : 1;

                                drone.rotation.x = pitch * invPitch * (Math.PI / 180);
                                drone.rotation.z = -roll * invRoll * (Math.PI / 180);
                                
                                // Låt drönaren ligga still på Y-axeln för en mjukare upplevelse
                                drone.position.y = 0;
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Läsfel: ", error);
            } finally {
                reader.releaseLock();
            }
        }
    </script>
</body>
</html>
